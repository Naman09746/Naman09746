<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070c"/>
      <stop offset="55%" stop-color="#0a0a16"/>
      <stop offset="100%" stop-color="#07070c"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a2e" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" fill="url(#grid)" opacity="0.5"/>

  <!-- floating network nodes -->
  <g opacity="0.65">
    <circle cx="120" cy="70" r="2.4" fill="#8B5CF6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="130" r="2" fill="#00D4FF"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="60" r="2.4" fill="#22D3EE"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="150" r="2" fill="#8B5CF6"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="300" r="2.2" fill="#00D4FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="300" r="2.2" fill="#22D3EE"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <line x1="120" y1="70" x2="230" y2="130" stroke="#00D4FF" stroke-width="0.6" opacity="0.35"/>
    <line x1="1040" y1="60" x2="1120" y2="150" stroke="#8B5CF6" stroke-width="0.6" opacity="0.35"/>
  </g>

  <!-- scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="#00D4FF" opacity="0.5">
    <animate attributeName="y" values="0;378;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- title -->
  <text x="60" y="160" font-family="'Courier New', monospace" font-size="64" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="4">NAMAN JOSHI</text>

  <text x="63" y="200" font-family="'Courier New', monospace" font-size="20" fill="#c9d1e0" letter-spacing="6">AI / ML&#160;&#160;+&#160;&#160;GENAI ENGINEER</text>

  <text x="63" y="238" font-family="Arial, sans-serif" font-size="15" fill="#8890a6">I design and engineer intelligent systems — from machine learning and retrieval</text>
  <text x="63" y="260" font-family="Arial, sans-serif" font-size="15" fill="#8890a6">pipelines to autonomous agents and production software.</text>

  <!-- status terminal -->
  <g transform="translate(60,285)" font-family="'Courier New', monospace" font-size="13">
    <rect x="0" y="0" width="460" height="80" rx="6" fill="#0d0d18" stroke="#22D3EE" stroke-opacity="0.35"/>
    <circle cx="16" cy="16" r="3" fill="#00D4FF"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="28" y="20" fill="#00D4FF">SYSTEM ONLINE</text>
    <text x="16" y="42" fill="#7d8aa3">MODE</text><text x="90" y="42" fill="#e6e9f2">BUILDING</text>
    <text x="230" y="42" fill="#7d8aa3">AGENTS</text><text x="300" y="42" fill="#e6e9f2">ACTIVE</text>
    <text x="16" y="64" fill="#7d8aa3">RETRIEVAL</text><text x="90" y="64" fill="#e6e9f2">ACTIVE</text>
    <text x="230" y="64" fill="#7d8aa3">MCP</text><text x="300" y="64" fill="#e6e9f2">CONNECTED</text>
    <rect x="0" y="0" width="460" height="80" rx="6" fill="none" stroke="#00D4FF" stroke-opacity="0.15">
      <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
