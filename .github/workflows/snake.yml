# Save this file as:  .github/workflows/snake.yml
# (create the .github and workflows folders if they don't exist yet)
#
# What it does: once a day — and once whenever you push to main — it reads
# your GitHub contribution graph, renders it as a snake-eating-squares
# animation in your cyan/blue/violet palette, and commits the result to a
# branch called "output". The README points at that branch, so the
# animation refreshes on its own from here on; you never touch it again.
#
# After adding this file to YOUR-USERNAME/YOUR-USERNAME:
#   1. Go to Settings -> Actions -> General -> Workflow permissions
#      and select "Read and write permissions", then Save.
#   2. Go to the Actions tab, click "generate snake animation" in the
#      sidebar, then "Run workflow" to generate it for the first time.
#   3. After it finishes (~30 seconds), refresh your profile page.

name: generate snake animation

on:
  schedule:
    - cron: "0 3 * * *"    # once a day at 03:00 UTC
  workflow_dispatch: {}     # adds a manual "Run workflow" button
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=2aa198&color_dots=ebedf0,c3d9f5,9fc0ee,7a9de0,6c71c4
            dist/snake-dark.svg?color_snake=2aa198&color_dots=0d1117,1b3a6b,2a5fb0,4a7fd0,6c71c4

      - name: push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
