<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pipeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="#07070c"/>

  <line x1="70" y1="100" x2="1130" y2="100" stroke="url(#pipeLine)" stroke-width="2" opacity="0.5"/>

  <!-- flowing particles -->
  <circle r="4" fill="#00D4FF">
    <animateMotion dur="4s" repeatCount="indefinite" path="M70,100 L1130,100"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#8B5CF6">
    <animateMotion dur="4s" begin="1.3s" repeatCount="indefinite" path="M70,100 L1130,100"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#22D3EE">
    <animateMotion dur="4s" begin="2.6s" repeatCount="indefinite" path="M70,100 L1130,100"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes -->
  <g font-family="'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle">
    <!-- template repeated manually -->
    <g transform="translate(70,100)">
      <circle r="26" fill="#0d0d18" stroke="#00D4FF" stroke-width="1.5"/>
      <circle r="26" fill="none" stroke="#00D4FF" stroke-opacity="0.25"><animate attributeName="r" values="26;34;26" dur="2.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.4;0;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
      <text y="5" fill="#e6e9f2" font-size="10">DATA</text>
      <text y="46" fill="#7d8aa3" font-size="10" font-weight="400">source</text>
    </g>
    <g transform="translate(222,100)">
      <circle r="26" fill="#0d0d18" stroke="#8B5CF6" stroke-width="1.5"/>
      <text y="0" fill="#e6e9f2" font-size="9.5">MACHINE</text>
      <text y="12" fill="#e6e9f2" font-size="9.5">LEARNING</text>
    </g>
    <g transform="translate(374,100)">
      <circle r="26" fill="#0d0d18" stroke="#00D4FF" stroke-width="1.5"/>
      <text y="0" fill="#e6e9f2" font-size="9.5">LLMs /</text>
      <text y="12" fill="#e6e9f2" font-size="9.5">GENAI</text>
    </g>
    <g transform="translate(526,100)">
      <circle r="26" fill="#0d0d18" stroke="#22D3EE" stroke-width="1.5"/>
      <text y="5" fill="#e6e9f2" font-size="11">RAG</text>
    </g>
    <g transform="translate(678,100)">
      <circle r="26" fill="#0d0d18" stroke="#8B5CF6" stroke-width="1.5"/>
      <text y="0" fill="#e6e9f2" font-size="9.5">AI</text>
      <text y="12" fill="#e6e9f2" font-size="9.5">AGENTS</text>
    </g>
    <g transform="translate(830,100)">
      <circle r="26" fill="#0d0d18" stroke="#00D4FF" stroke-width="1.5"/>
      <text y="0" fill="#e6e9f2" font-size="9.5">TOOLS /</text>
      <text y="12" fill="#e6e9f2" font-size="9.5">MCP</text>
    </g>
    <g transform="translate(982,100)">
      <circle r="26" fill="#0d0d18" stroke="#22D3EE" stroke-width="1.5"/>
      <text y="0" fill="#e6e9f2" font-size="9">APPS /</text>
      <text y="12" fill="#e6e9f2" font-size="9">SYSTEMS</text>
    </g>
    <g transform="translate(1130,100)">
      <circle r="26" fill="#0d0d18" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle r="26" fill="none" stroke="#8B5CF6" stroke-opacity="0.25"><animate attributeName="r" values="26;34;26" dur="2.5s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.4;0;0.4" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text y="0" fill="#e6e9f2" font-size="9">DEPLOY-</text>
      <text y="12" fill="#e6e9f2" font-size="9">MENT</text>
    </g>
  </g>

  <text x="600" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7d8aa3">I don't treat AI as a model endpoint — I build the retrieval, memory, tools, evaluation and deployment around it.</text>
</svg>
