<svg width="1100" height="420" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="420" fill="#07070c"/>
  <text x="30" y="34" font-family="'Courier New', monospace" font-size="15" fill="#7d8aa3" letter-spacing="2">SKILL → IMPLEMENTATION → PROJECT</text>

  <g font-family="'Courier New', monospace" font-size="11" font-weight="700">
    <!-- left column: skills -->
    <g text-anchor="end">
      <g transform="translate(150,80)"><circle r="5" fill="#00D4FF"/><text x="-14" y="4" fill="#e6e9f2">LANGGRAPH</text></g>
      <g transform="translate(150,130)"><circle r="5" fill="#8B5CF6"/><text x="-14" y="4" fill="#e6e9f2">FASTAPI</text></g>
      <g transform="translate(150,180)"><circle r="5" fill="#22D3EE"/><text x="-14" y="4" fill="#e6e9f2">PYTORCH</text></g>
      <g transform="translate(150,230)"><circle r="5" fill="#00D4FF"/><text x="-14" y="4" fill="#e6e9f2">XGBOOST</text></g>
      <g transform="translate(150,280)"><circle r="5" fill="#8B5CF6"/><text x="-14" y="4" fill="#e6e9f2">NEXT.JS</text></g>
      <g transform="translate(150,330)"><circle r="5" fill="#22D3EE"/><text x="-14" y="4" fill="#e6e9f2">POSTGRESQL</text></g>
    </g>

    <!-- right column: projects -->
    <g text-anchor="start">
      <g transform="translate(760,55)"><circle r="5" fill="#00D4FF"/><text x="14" y="4" fill="#e6e9f2">SELF-HEALING RAG</text></g>
      <g transform="translate(760,105)"><circle r="5" fill="#8B5CF6"/><text x="14" y="4" fill="#e6e9f2">AGENTIC MARKETING</text></g>
      <g transform="translate(760,155)"><circle r="5" fill="#22D3EE"/><text x="14" y="4" fill="#e6e9f2">CALLCRM 2.0</text></g>
      <g transform="translate(760,205)"><circle r="5" fill="#00D4FF"/><text x="14" y="4" fill="#e6e9f2">DATAGUARD</text></g>
      <g transform="translate(760,255)"><circle r="5" fill="#8B5CF6"/><text x="14" y="4" fill="#e6e9f2">VEHICLE MONITORING</text></g>
      <g transform="translate(760,305)"><circle r="5" fill="#22D3EE"/><text x="14" y="4" fill="#e6e9f2">NEUROPLAN AI</text></g>
      <g transform="translate(760,355)"><circle r="5" fill="#00D4FF"/><text x="14" y="4" fill="#e6e9f2">MICROGRID</text></g>
    </g>
  </g>

  <!-- connecting edges -->
  <g fill="none" stroke-width="1" opacity="0.45">
    <path d="M155,80 C400,80 500,55 755,55" stroke="#00D4FF"/>
    <path d="M155,80 C400,90 500,105 755,105" stroke="#00D4FF"/>
    <path d="M155,130 C400,130 500,55 755,55" stroke="#8B5CF6"/>
    <path d="M155,130 C400,150 500,205 755,205" stroke="#8B5CF6"/>
    <path d="M155,130 C400,190 500,255 755,255" stroke="#8B5CF6"/>
    <path d="M155,180 C400,220 500,305 755,305" stroke="#22D3EE"/>
    <path d="M155,180 C400,190 500,205 755,205" stroke="#22D3EE"/>
    <path d="M155,230 C400,280 500,355 755,355" stroke="#00D4FF"/>
    <path d="M155,280 C400,260 500,155 755,155" stroke="#8B5CF6"/>
    <path d="M155,280 C400,270 500,255 755,255" stroke="#8B5CF6"/>
    <path d="M155,330 C400,330 500,80 755,80" stroke="#22D3EE" opacity="0.25"/>
    <path d="M155,330 C400,340 500,350 755,350" stroke="#22D3EE"/>
  </g>

  <!-- traveling pulses on a couple key edges -->
  <circle r="3.5" fill="#00D4FF">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M155,80 C400,80 500,55 755,55"/>
  </circle>
  <circle r="3.5" fill="#8B5CF6">
    <animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite" path="M155,130 C400,150 500,205 755,205"/>
  </circle>
  <circle r="3.5" fill="#22D3EE">
    <animateMotion dur="3.8s" begin="1.6s" repeatCount="indefinite" path="M155,180 C400,220 500,305 755,305"/>
  </circle>

  <text x="550" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7d8aa3">every edge is a real dependency, not a badge</text>
</svg>
